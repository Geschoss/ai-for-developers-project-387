# Агент OpenCode отвечает на /oc и /opencode в комментариях к issue и PR. Описание: README.md, «Агент OpenCode»
# и «Предел запусков на PR».
name: opencode

# По номеру в имени запуска счётчик связывает запуски с PR (scripts/oc-budget.sh). Имя от комментария не зависит.
# В кавычках: без них YAML считает " #..." комментарием и имя запуска превращается в «opencode».
run-name: "opencode #${{ github.event.issue.number || github.event.pull_request.number }}"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

env:
  # Допущенных запусков агента на один PR.
  OC_LIMIT: "3"

jobs:
  # Бюджет проверяется кодом до вызова модели. Модели и секрета здесь нет.
  budget:
    # Команду даёт доверенный участник; боты и fork (у них нет секретов) пропускаются.
    if: |
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot' &&
      (github.event_name == 'issue_comment' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.budget.outputs.allowed }}
      same_repo: ${{ steps.kind.outputs.same_repo }}
      used: ${{ steps.budget.outputs.used }}
      limit: ${{ steps.budget.outputs.limit }}
      is_pr: ${{ steps.kind.outputs.is_pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Is it a PR from this repository
        id: kind
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
        run: |
          set -euo pipefail
          echo "is_pr=${IS_PR}" >> "${GITHUB_OUTPUT}"
          # Агент исполняет скрипты проекта с секретом в окружении: код из fork ему запускать нельзя.
          # Для issue_comment проверка head.repo в условии job невозможна, поэтому она здесь.
          same_repo=true
          if [[ "${IS_PR}" == "true" ]]; then
            head_repo="$(gh api "repos/${REPO}/pulls/${NUMBER}" --jq '.head.repo.full_name // ""')"
            if [[ "${head_repo}" != "${REPO}" ]]; then same_repo=false; fi
          fi
          echo "same_repo=${same_repo}" >> "${GITHUB_OUTPUT}"

      - name: Count the runs spent on this PR
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          LIMIT: ${{ env.OC_LIMIT }}
          IS_PR: ${{ steps.kind.outputs.is_pr }}
        run: |
          set -euo pipefail
          bash scripts/oc-budget.sh count

  opencode:
    needs: budget
    if: needs.budget.outputs.allowed == 'true' && needs.budget.outputs.same_repo == 'true'
    runs-on: ubuntu-latest
    # Тот же срок в TIMEOUT_MINUTES задания report (по нему определяется причина timeout); сверяет scripts/oc-budget.test.sh.
    timeout-minutes: 60
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
      id-token: write
    steps:
      - name: Check the model key
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [[ -z "${OPENCODE_API_KEY}" ]]; then
            echo "OPENCODE_API_KEY is not set" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # Агент проверяет свою работу сам (mise run fix/check, opencode.json): ему нужен тулчейн проекта.
      - name: Install the toolchain from mise.toml
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      # «Re-run failed jobs» не перезапускает budget и оставляет его прошлый вердикт: пересчитываем в самой попытке.
      # Два шага, чтобы сбой подсчёта (infra) отличался от отказа по бюджету (limit_exhausted).
      - name: Recount the budget
        id: recount
        if: github.run_attempt > 1 && needs.budget.outputs.is_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          LIMIT: ${{ env.OC_LIMIT }}
        run: bash scripts/oc-budget.sh count

      - name: Recheck the budget
        if: steps.recount.outcome == 'success'
        env:
          ALLOWED: ${{ steps.recount.outputs.allowed }}
        run: |
          if [[ "${ALLOWED}" != "true" ]]; then
            echo "Budget exhausted on a re-run" >&2
            exit 1
          fi

      - name: Run OpenCode
        uses: anomalyco/opencode/github@v1.19.5
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # gh внутри агента: публикация спецификаций и тикетов, метки. Права: issues: write.
          GH_TOKEN: ${{ github.token }}
        with:
          model: opencode/deepseek-v4.1-flash
          mentions: "/oc,/opencode"

  # Итог без модели: отказ по бюджету и причина сбоя. Запускается и после падения, и после тайм-аута агента.
  report:
    needs: [budget, opencode]
    # Сбой самого budget тоже виден человеку; пропущенный budget (чужой комментарий) молчит.
    if: always() && contains(fromJSON('["success","failure","cancelled"]'), needs.budget.result)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
      # write: комментарий к PR (в том числе через REST issues) иначе даёт 403. Модели и секрета в задании нет.
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ALLOWED: ${{ needs.budget.outputs.allowed }}
      USED: ${{ needs.budget.outputs.used }}
      LIMIT: ${{ needs.budget.outputs.limit }}
      IS_PR: ${{ needs.budget.outputs.is_pr }}
      AGENT_RESULT: ${{ needs.opencode.result }}
      BUDGET_RESULT: ${{ needs.budget.result }}
      # Равно timeout-minutes задания opencode.
      TIMEOUT_MINUTES: "60"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Say why a person is needed
        run: |
          set -euo pipefail
          sha=""
          if [[ "${IS_PR}" == "true" ]]; then
            sha="$(gh pr view "${NUMBER}" --repo "${REPO}" --json headRefOid --jq .headRefOid)"
          fi

          if [[ "${BUDGET_RESULT}" != "success" ]]; then
            reason="infra"
            detail="Не удалось проверить бюджет запусков, модель не вызывалась. Смотрите лог."
          elif [[ "${ALLOWED}" != "true" ]]; then
            reason="limit_exhausted"
            detail="Допущено запусков агента на этот PR: ${USED} из ${LIMIT}. Модель не вызывалась. Пересмотрите подход или завершите правку сами."
          elif [[ "${AGENT_RESULT}" == "success" || "${AGENT_RESULT}" == "skipped" ]]; then
            exit 0
          else
            job="$(gh api "repos/${REPO}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100" \
              --jq '[.jobs[] | select(.name == "opencode")] | first // {}')"
            reason="$(bash scripts/oc-budget.sh reason <<<"${job}")"
            case "${reason}" in
              timeout) detail="Агент не уложился в ${TIMEOUT_MINUTES} минут." ;;
              limit_exhausted) detail="Повторная попытка отклонена: бюджет запусков этого PR (${LIMIT}) исчерпан. Модель не вызывалась. Пересмотрите подход или завершите правку сами." ;;
              infra) detail="Сбой подготовки: нет секрета модели или не запустился инструмент." ;;
              agent_failed) detail="Агент завершился с ошибкой." ;;
              *) reason="unknown"; detail="Причина не определена, проверьте лог." ;;
            esac
          fi

          {
            echo "## Агент OpenCode: нужен человек"
            echo
            echo "- **Причина:** \`${reason}\`"
            [[ -n "${sha}" ]] && echo "- **Последний SHA:** \`${sha}\`"
            echo "- **Лог:** ${RUN_URL}"
            echo
            echo "${detail}"
          } > comment.md
          gh issue comment "${NUMBER}" --repo "${REPO}" --body-file comment.md
