# Агент OpenCode отвечает на /oc и /opencode в комментариях к issue и PR. Описание: README.md, «Агент OpenCode».
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Команду даёт доверенный участник; боты и fork (у них нет секретов) пропускаются.
    if: |
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot' &&
      (github.event_name == 'issue_comment' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@v1.19.5
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4.1-flash
          mentions: "/oc,/opencode"

  # Action OpenCode называет PR сам: заголовок — пересказ ответа агента в 40 символов, тело — весь ответ.
  # Здесь заголовок берётся из последнего коммита ветки, а `Closes #<n>` ставится первой строкой тела.
  # Описание: docs/research/opencode-pr-title.md.
  fix-pr:
    needs: opencode
    if: needs.opencode.result == 'success' && github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fix title and body of the agent PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # Ветка агента: opencode/issue<N>-<время>. Если PR не создавался (агент ответил текстом), делать нечего.
          prs=$(gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"opencode/issue${ISSUE}-\")) | .number")
          for pr in $prs; do
            title=$(gh pr view "$pr" --json commits --jq '.commits[-1].messageHeadline')
            body=$(gh pr view "$pr" --json body --jq .body)
            rest=$(printf '%s\n' "$body" | grep -v -x "Closes #${ISSUE}" || true)
            gh pr edit "$pr" --title "$title" --body "$(printf 'Closes #%s\n\n%s' "$ISSUE" "$rest")"
          done
